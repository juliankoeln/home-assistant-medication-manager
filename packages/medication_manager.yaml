blueprint:
input_select:
  med_auswahl:
    name: Medikament auswählen
    options:
      - Blutdruck
      - Schilddruese
      - VitaminD

  med_einnahmezeit:
    name: Einnahmezeit
    options:
      - Morgens
      - Abends

input_number:
  med_blutdruck_bestand:
    name: Blutdruck – Bestand
    min: 0
    max: 500
    step: 0.5

  med_blutdruck_dosis_morgens:
    name: Blutdruck – Dosis morgens
    min: 0
    max: 5
    step: 0.5

  med_blutdruck_dosis_abends:
    name: Blutdruck – Dosis abends
    min: 0
    max: 5
    step: 0.5

  med_blutdruck_packung:
    name: Blutdruck – Packungsgröße
    min: 1
    max: 500
    step: 1

input_datetime:
  med_blutdruck_rezept:
    name: Blutdruck – letztes Rezept
    has_date: true
    has_time: false
